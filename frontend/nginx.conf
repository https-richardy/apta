server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;

    # never cache the entry document so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # long, immutable cache for the fingerprinted framework and static assets
    location ~* \.(?:js|wasm|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|json|dll|dat|blat)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # single page application fallback: unknown routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
