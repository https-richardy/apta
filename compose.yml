services:
  apta.infrastructure.postgres:
    container_name: "apta.infrastructure.postgres"
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - apta.infrastructure.postgres:/var/lib/postgresql/data

  apta.infrastructure.keycloak:
    container_name: "apta.infrastructure.keycloak"
    image: quay.io/keycloak/keycloak:26.6.2
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

  apta.infrastructure.seq:
    container_name: "apta.infrastructure.seq"
    image: datalust/seq:latest
    ports:
      - "5341:80"
      - "5342:5341"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_PASSWORD}
    volumes:
      - apta.infrastructure.seq:/data

volumes:
  apta.infrastructure.postgres:
  apta.infrastructure.seq:
