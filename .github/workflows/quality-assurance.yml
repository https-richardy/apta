name: quality assurance (reusable)

on:
  workflow_call:
    inputs:
      project-name:
        description: friendly name shown in the job and coverage artifact (e.g. backend, webui)
        required: true
        type: string
      working-directory:
        description: solution root to restore, build and test (e.g. backend, frontend)
        required: true
        type: string
      configuration:
        description: dotnet build and test configuration
        required: false
        type: string
        default: Debug

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ inputs.project-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ inputs.working-directory }}/global.json

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build --no-restore --configuration ${{ inputs.configuration }}

      - name: test
        run: >
          dotnet test --no-build --configuration ${{ inputs.configuration }}
          --coverage
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml

      - name: coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator \
            -reports:**/*.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:MarkdownSummaryGithub
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.project-name }}
          path: |
            ${{ inputs.working-directory }}/**/TestResults/coverage.cobertura.xml
            ${{ inputs.working-directory }}/coverage-report/**
          if-no-files-found: error
